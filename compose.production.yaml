# Deployment template: external managed PostgreSQL and a trusted HTTPS ingress required.
services:
  web:
    build: .
    env_file: .env.production
    environment:
      DEBUG: "false"
      EMAIL_BACKEND_MODE: resend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 30
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy", "--fail-level", "WARNING"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    env_file: .env.production
    environment:
      DEBUG: "false"
      EMAIL_BACKEND_MODE: resend
    command: python manage.py run_reminder_worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_worker"]
      interval: 10s
      timeout: 5s
      retries: 3
