[project]
name = "task-reminder"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
 "Django>=5.2,<5.3", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23",
 "django-allauth[socialaccount]>=65,<66", "httpx>=0.28,<1",
 "svix>=1.60,<2", "cryptography>=44", "gunicorn>=23; sys_platform != 'win32'",
 "dj-database-url>=2", "python-dotenv>=1", "whitenoise>=6"
]
[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "pytest-playwright>=0.6", "time-machine>=2"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
