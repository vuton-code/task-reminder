services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: task_reminder
      POSTGRES_PASSWORD: task_reminder
      POSTGRES_DB: task_reminder
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_reminder"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://task_reminder:task_reminder@db:5432/task_reminder
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["127.0.0.1:8000:8000"]
    volumes: [".:/app"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://task_reminder:task_reminder@db:5432/task_reminder
    command: python manage.py run_reminder_worker
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', 'manage.py', 'check_worker']
      interval: 10s
      timeout: 5s
      retries: 3
    volumes: [".:/app"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  database:

